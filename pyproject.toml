[build-system]
requires = ["scikit-build-core>=0.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "traminex"
version = "0.2.2"
description = "R-faithful social-science sequence analysis porting TraMineR and TraMineRextras"
readme = "README.md"
authors = [{name = "PROJECT_PY_TRAMINEX"}]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6", "seaborn>=0.12"]
perf = ["numba>=0.59"]
extras = ["scikit-learn>=1.3"]
# disstreedisplay/seqtreedisplay shell out to the *system* GraphViz `dot`
# executable (traminex/disstree_viz.py::_locate_dot honours GVPATH, else
# shutil.which("dot")); the package never imports the Python `graphviz`
# distribution, so this profile installs nothing pip can supply and exists only
# to keep `pip install traminex[tree]` a valid, documented command (cycle-6
# F-004). See README.md and docs/DEV_BUILD.md.
tree = []
# The maintained `datasci` environment is the reference: the codebase tracks the
# tools installed there, never the other way round. These are floors at the
# versions that environment carries, so nothing here can force it to downgrade.
# `make format-check` and `make lint` both run the *environment's* tool, so the
# gate cannot disagree with the developer's own invocation (cycle-6 F-002); the
# .pre-commit-config.yaml revisions are kept at the same versions so
# `pre-commit install` behaves identically. tests/test_supported_versions.py
# fails if any declaration drops below what is installed.
dev = ["black[jupyter]>=26.5.1", "build>=1.2", "scikit-build-core>=0.11.0", "ruff>=0.16.9", "pre-commit>=3.7.0", "mypy>=1.10", "pytest>=7.0", "pytest-cov>=4.0", "pyyaml>=6.0"]

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["traminex"]
wheel.py-api = "py3"
wheel.platlib = false
sdist.exclude = ["**"]
sdist.include = [
