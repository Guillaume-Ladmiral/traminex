# scikit-build-core 0.12 and later know the manual inclusion mode, which reads
# no .gitignore file. 0.11.0, the floor, does not know the option and reads the
# include list with gitignore rules, under which a bare name matches at any
# depth, so every root entry above is anchored with "/" (TX-AUD-20261010-047,
# batch-5 review I-4).
[[tool.scikit-build.overrides]]
if.scikit-build-version = ">=0.12"
sdist.inclusion-mode = "manual"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '(^\.external/|^vendor/)'

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/.external/**", "vendor/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A traminex diagnostic a test does not state is an error (TX-AUD-20261019-068): a test that
# triggers one on purpose says so with pytest.warns or a filterwarnings mark. A deprecation raised
# inside matplotlib's own modules is matplotlib's: at the declared floor, matplotlib 3.6.0 calls
# pyparsing names that pyparsing 3.3 deprecates (TX-REP-20261025-001).
filterwarnings = [
  "error::UserWarning",
  "error::DeprecationWarning",
  "ignore::DeprecationWarning:matplotlib(\\..*)?$",
]
norecursedirs = [
  "vendor",
  ".external",
  "SOURCES",
  "DATA",
  "DOCUMENTATION",
  "DEMOS",
]

[tool.mypy]
packages = ["traminex"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[tool.ruff.lint]
select = ["E","F","W","I"]  # pycodestyle, pyflakes, warnings, import order
ignore = ["E501", "E741", "F841"]  # handled by black; allow short var names; allow unused assignments
