name: Ubuntu pybind11 wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install wheel build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja pybind11 scikit-build-core
      - name: Build explicit pybind11 wheel
        run: |
          export PYBIND11_DIR="$(python -m pybind11 --cmakedir)"
          python - <<'PY'
          import os
          from pathlib import Path
          from scikit_build_core.build import build_wheel

          output = Path("dist")
          output.mkdir(exist_ok=True)
          name = build_wheel(
              str(output),
              config_settings={
                  "cmake.args": [
                      "-DTRAMINEX_BUILD_PYBIND11=ON",
                      f"-Dpybind11_DIR={os.environ['PYBIND11_DIR']}",
                  ],
                  "wheel.platlib": "true",
                  "wheel.py-api": "",
              },
          )
          print(name)
          PY
      - name: Verify installed wheel backend and OpenMP
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          TRAMINEX_BINDING=pybind11 python - <<'PY'
          from pathlib import Path
          import os
          import traminex
          from traminex import _pb_kernels, distances

          assert not str(Path(traminex.__file__).resolve()).startswith(os.environ["GITHUB_WORKSPACE"])
          assert distances._impl_name() == "pybind11"
          assert _pb_kernels.accel_openmp_enabled() is True
          print("backend:", distances._impl_name())
          print("OpenMP:", _pb_kernels.accel_openmp_enabled())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: traminex-pybind11-ubuntu-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
